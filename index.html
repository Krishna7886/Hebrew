<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Hebrew Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for speaker icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="container">
        <h1>Dynamic Hebrew Quiz</h1>
        <!-- Start Screen -->
        <div id="start-screen">
            <p>Test your knowledge of Hebrew letters, words, and their pronunciations.</p>
            <div class="input-group">
                <label for="num-questions">How many questions would you like?</label>
                <input type="number" id="num-questions" value="20" min="5" max="100">
            </div>
            <button id="start-quiz-btn">Start Quiz</button>
        </div>
        <!-- Quiz Area -->
        <div id="quiz-area" class="hidden">
            <div id="question-counter"></div>
            <div id="question-box">
                <p class="meaning-label">Meaning:</p>
                <div id="english-meaning" class="meaning-display"></div>
                <div id="hebrew-word-container">
                    <div id="hebrew-word"></div>
                    <button id="play-audio-btn" aria-label="Play audio pronunciation">
                        <i class="fas fa-volume-up"></i>
                        <span id="audio-loading" class="loading hidden">Loading...</span>
                    </button>
                </div>
            </div>
            <input type="text" id="answer-input" placeholder="Type the pronunciation here..." autofocus>
            <button id="submit-btn">Submit Answer</button>
            <div id="feedback"></div>
            <button id="next-btn" class="hidden">Next Question</button>
            <button id="restart-btn" class="hidden">Restart Quiz</button>
        </div>
        <!-- Results Area -->
        <div id="results-area" class="hidden">
            <h2>Quiz Results</h2>
            <p>You got <span id="correct-count"></span> out of <span id="total-questions"></span> correct!</p>
            <h3>Summary:</h3>
            <ul id="summary-list"></ul>
            <button id="restart-from-results-btn">Start New Quiz</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
